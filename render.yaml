services:
  - type: web
    name: n11ltuddn
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m pip install -r requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npx prisma migrate deploy && node prisma/deploy-bootstrap.mjs && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_DIST_DIR
        value: frontend/dist
      - key: AUTH_SESSION_TTL_SECONDS
        value: 86400
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: n11ltuddn-db
          property: connectionString

databases:
  - name: n11ltuddn-db
    plan: free
    databaseName: ai_kms_prod
    user: n11ltuddn
